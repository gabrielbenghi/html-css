<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.conteiner{
            background-color: aquamarine;
            display: flex;
            flex-flow: row nowrap;


        }

        div.item{
            background-color: rgb(199, 70, 238);
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
            flex-grow: 0;
            flex-shrink: 0;
          
        }

        div#cxA{
        flex: 0 1 200px;
        }

        div#cxB{
        flex: 2 1 150px;
        }

        div#cxC{
        flex: 4 1 150px;        
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>

    </div>
</body>
</html>
